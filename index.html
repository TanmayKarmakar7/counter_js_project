<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    
    <div class="counter">
        
        <h1 id="heading">Click Counter App</h1>
        
        <p id="count">0</p>
        
        <div class="buttons">
            <button id="decrease"><i class="fa-solid fa-minus"></i></button>
            <button id="reset"><i class="fa-solid fa-rotate"></i></button>
            <button id="increase"><i class="fa-solid fa-plus"></i></button>
            <button id="double"><i class="fa-solid fa-xmark"></i> <i class="fa-solid fa-2"></i></button>
            <button id="themeToggle">🌙</button>
        </div>
    </div>
    

    <script src="script.js"></script>
</body>
</html>
